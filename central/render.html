<!doctype html><html><head><meta charset="utf-8"><title>render</title>
<style>html,body{margin:0;background:#202429;overflow:hidden}canvas{display:block}</style></head><body>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
// Gera a miniatura de um STL (usado pelo criar/miniaturas.sh com o Chrome sem tela)
import * as THREE from "three";
import { STLLoader } from "three/addons/loaders/STLLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
const q = new URLSearchParams(location.search);
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const cena = new THREE.Scene(); cena.background = new THREE.Color(0x202429);
cena.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const sol = new THREE.DirectionalLight(0xffffff, 1.5); sol.position.set(-1, 2, 1.4); cena.add(sol);
cena.add(new THREE.HemisphereLight(0xdfe8ff, 0x20242a, 0.5));
const geo = new STLLoader().parse(await (await fetch(q.get("stl"))).arrayBuffer());
geo.rotateX(-Math.PI / 2); geo.computeBoundingBox();
const b = geo.boundingBox, c = new THREE.Vector3(); b.getCenter(c); geo.translate(-c.x, -b.min.y, -c.z); geo.computeVertexNormals();
geo.computeBoundingBox(); const s = new THREE.Vector3(); geo.boundingBox.getSize(s);
cena.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: q.get("cor") || "#ff8a3d", roughness: 0.5 })));
const R = Math.max(s.x, s.y, s.z);
const cam = new THREE.PerspectiveCamera(30, W / H, 1, 5000);
cam.position.set(R * 1.35, R * 1.25, R * 1.75); cam.lookAt(0, s.y * 0.42, 0);
r.render(cena, cam); document.title = "pronto";
</script></body></html>
